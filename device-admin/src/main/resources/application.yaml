# device-admin：后台管理进程（EP-003 建档 / EP-004 编辑 / EP-005 删除 / EP-009 列表 / EP-010 变更记录 /
# EP-011 死信治理），JWT 鉴权 + 操作人上下文，写路径带乐观锁与幂等键。
#
# 本文件不含任何密钥：JWT 公钥只从挂载文件读取（device.admin.jwt.public-key-path，取自环境变量），
# 缺键时 SecurityConfig 直接抛异常拒绝启动，不允许内置公钥兜底。
spring:
  application:
    name: device-admin
  main:
    banner-mode: off
  lifecycle:
    # 后台写路径都是短事务，30s 足够在停机前排空在途请求。
    timeout-per-shutdown-phase: 30s
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:device_management}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USER:device}
    password: ${DB_PASSWORD:}
    hikari:
      minimum-idle: 10
      maximum-pool-size: 50
      connection-timeout: 3000
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      # 幂等键与限流都走 Redis：超时缺失会让 Tomcat 线程被慢调用占满。
      timeout: 200ms
      connect-timeout: 200ms
server:
  port: ${SERVER_PORT:8083}
  shutdown: graceful
mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    # 单条语句 2s 上限：后台查询不排队，超时即失败。
    default-statement-timeout: 2
management:
  server:
    port: ${MANAGEMENT_PORT:9092}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        # 进程自身存活：依赖抖动不杀进程，避免重启风暴。
        liveness:
          include: ping,diskSpace
        # 就绪：DB 或 Redis 不可用时摘流量（幂等键与乐观锁都依赖它们）。
        readiness:
          include: db,redis
logging:
  structured:
    format:
      console: ecs
device:
  admin:
    # 深翻页上限：offset 超过它时列表接口回 4004，避免深分页拖垮 DB。
    max-offset: 10000
    idem-ttl-hours: 24
    jwt:
      # 三键均无默认值：缺任何一个都拒绝启动（SecurityConfig 断言）。
      issuer: ${DEVICE_ADMIN_JWT_ISSUER}
      audience: ${DEVICE_ADMIN_JWT_AUDIENCE}
      public-key-path: ${DEVICE_ADMIN_JWT_PUBLIC_KEY_PATH}
  cache:
    ttl-base: 1800s
    ttl-jitter: 300s
    empty-ttl: 60s
    rebuild-spin-times: 3
  query:
    batch-max: 100
  cron:
    # 本进程只跑 DimAuthCache 的刷新；这两个比例是 device-core 的启动断言（§11.1），
    # 缺键会拒绝启动，取值与写侧进程保持一致。
    lock-ttl-ratio: 0.8
    lock-safety-margin-ratio: 0.2
    watermark-ttl-hours: 168
